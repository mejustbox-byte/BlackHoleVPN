name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  real-xray:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download pinned Xray and verify archive digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip
          printf '%s  %s\n' '0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978' "$RUNNER_TEMP/xray.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod 700 "$RUNNER_TEMP/xray/xray"
      - name: Real Xray configuration, export and recovery tests
        shell: bash
        run: BLACKHOLE_TEST_XRAY="$RUNNER_TEMP/xray/xray" python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
